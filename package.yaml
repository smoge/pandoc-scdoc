name: pandoc-scdoc
version: 0.2.0.0
synopsis: Pandoc reader and writer for SuperCollider's SCDoc help format
category: Text
github: "smoge/pandoc-scdoc"
license: GPL-3.0-only
author: "smoge"
maintainer: "smoge <https://github.com/smoge>"
copyright: "2026 smoge"

extra-source-files:
  - README.md

extra-doc-files:
  - CHANGELOG.md

data-files:
  - data/templates/default.schelp

description: Please see the README on GitHub at <https://github.com/smoge/pandoc-scdoc>

dependencies:
  - base >= 4.7 && < 5
  - containers >= 0.6 && < 0.8
  - doclayout >= 0.5 && < 0.6
  - doctemplates >= 0.11 && < 0.12
  - mtl >= 2.2 && < 2.4
  - pandoc >= 3.7 && < 3.10
  - pandoc-types >= 1.23 && < 1.24
  - parsec >= 3.1 && < 3.2
  - text >= 2.0 && < 2.2

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

internal-libraries:
  # Token/AST internals for the SCDoc reader's token-based parser.
  scdoc-internals:
    source-dirs: src-internal
    exposed-modules:
      - Text.Pandoc.Readers.SCDoc.Lexer
      - Text.Pandoc.Readers.SCDoc.Parser
      - Text.Pandoc.SCDoc.Link

library:
  source-dirs: src
  exposed-modules:
    - Text.Pandoc.Readers.SCDoc
    - Text.Pandoc.Writers.SCDoc
  dependencies:
    - scdoc-internals

executables:
  pandoc-scdoc:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - pandoc-scdoc

tests:
  pandoc-scdoc-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - pandoc-scdoc
      - scdoc-internals
      - hspec >= 2.10
      - QuickCheck
      - containers
      - doctemplates
      - pandoc
      - directory
      - filepath
